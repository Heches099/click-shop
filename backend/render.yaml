services:
  - type: web
    name: clickshop-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: ADMIN_EMAIL
        value: admin@clickshop.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://click-shop-d62ad.web.app,http://localhost:8080,http://localhost:3000,http://localhost:5173
      - key: STORE_BASE_URL
        value: https://click-shop-d62ad.web.app
      - key: AFFILIATE_COMMISSION_RATE
        value: "0.10"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    healthCheckPath: /docs

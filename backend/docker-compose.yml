services:
  db:
    image: postgres:16-alpine
    container_name: clickshop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clickshop
      POSTGRES_PASSWORD: clickshop
      POSTGRES_DB: clickshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

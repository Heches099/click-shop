name: click_shop
description: A production-ready e-commerce app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  firebase_analytics: ^12.4.6
  google_sign_in: ^7.2.0

  # State management & DI
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  get_it: ^9.2.1
  dartz: ^0.10.1

  # Navigation
  go_router: ^17.4.0

  # Network
  dio: ^5.5.0
  connectivity_plus: ^7.3.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Model generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.1
  fluttertoast: ^10.0.0
  lottie: ^3.1.2
  badges: ^3.1.2
  readmore: ^3.0.0
  percent_indicator: ^4.2.3
  flutter_staggered_grid_view: ^0.7.0
  animate_do: ^5.1.0

  # Ads
  google_mobile_ads: ^9.0.0

  # Web (Google AdSense)
  web: ^1.1.1

  # Payments
  flutter_stripe: ^13.1.0
  
  # For production use the official packages.

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/dummy/
  # Add fonts if needed

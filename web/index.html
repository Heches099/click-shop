<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ClickShop — SEO & performance hardened entry point.
    - Declarative (hash-free) URLs are handled by go_router + the hosting
      rewrite rules (see firebase.json) so every deep link serves index.html.
    - The Wasm/Skwasm engine is pinned in web/flutter_bootstrap.js.
    - Static, crawlable HTML for product/category/guide pages is generated by
      tools/prerender.mjs after each `flutter build web` (served via cleanUrls).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google-site-verification" content="om6wtq_QAg9T6agjMo6fyHI6l9tKYxid3x2KZ7zqZmQ" />

  <!-- Primary SEO -->
  <title>ClickShop — Premium Fashion, Sneakers &amp; Electronics</title>
  <meta name="description" content="ClickShop is your premium online store for fashion, sneakers and electronics at the best prices. Fast delivery, genuine products and real customer reviews.">
  <meta name="keywords" content="online shopping, sneakers, fashion, electronics, best prices, ClickShop">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="author" content="ClickShop">
  <link rel="canonical" href="https://click-shop-d62ad.web.app/">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">

  <!-- Open Graph / social -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ClickShop">
  <meta property="og:title" content="ClickShop — Premium Fashion, Sneakers &amp; Electronics">
  <meta property="og:description" content="Premium fashion, sneakers and electronics at the best prices. Fast delivery, genuine products, real reviews.">
  <meta property="og:url" content="https://click-shop-d62ad.web.app/">
  <meta property="og:image" content="https://click-shop-d62ad.web.app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ClickShop — Premium Fashion, Sneakers &amp; Electronics">
  <meta name="twitter:description" content="Premium fashion, sneakers and electronics at the best prices.">
  <meta name="twitter:image" content="https://click-shop-d62ad.web.app/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ClickShop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Static Organization + WebSite structured data (present even before the
       Wasm engine boots, so crawlers always see valid schema). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://click-shop-d62ad.web.app/#website",
        "url": "https://click-shop-d62ad.web.app/",
        "name": "ClickShop",
        "description": "Premium fashion, sneakers and electronics at the best prices.",
        "inLanguage": "en-US"
      },
      {
        "@type": "Organization",
        "@id": "https://click-shop-d62ad.web.app/#organization",
        "url": "https://click-shop-d62ad.web.app/",
        "name": "ClickShop",
        "logo": "https://click-shop-d62ad.web.app/icons/Icon-512.png"
      }
    ]
  }
  </script>

  <!-- The prerenderer (tools/prerender.mjs) injects a live ItemList schema
       between these markers after every `flutter build web`. -->
  <!--PRERENDER:SCHEMA--><!--/PRERENDER:SCHEMA-->
</head>
<body>
  <!-- Loading indicator shown until the engine paints its first frame. -->
  <div id="flt-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:9999;font-family:-apple-system,Segoe UI,Roboto,sans-serif;">
    <img src="icons/Icon-192.png" width="64" height="64" alt="ClickShop" style="border-radius:16px;">
    <p style="margin-top:16px;color:#555;font-size:14px;">Loading ClickShop…</p>
  </div>

  <script>
    // Remove the loading overlay once the engine reports a first frame.
    window.addEventListener('flutter-first-frame', () => {
      var el = document.getElementById('flt-loading');
      if (el) { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(function(){ el.remove(); }, 300); }
    });
    // Safety fallback so the overlay can never block a page.
    window.addEventListener('load', function () {
      setTimeout(function () {
        var el = document.getElementById('flt-loading');
        if (el) { el.remove(); }
      }, 15000);
    });
  </script>

  <noscript>
    <!--PRERENDER:NOSCRIPT-->
    <div style="max-width:720px;margin:48px auto;padding:0 24px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#222;">
      <h1>ClickShop — Premium Fashion, Sneakers &amp; Electronics</h1>
      <p>ClickShop offers premium fashion, sneakers and electronics at the best prices with fast, reliable delivery. Browse the full catalog with JavaScript enabled, or contact our team any time.</p>
      <h2>Popular categories</h2>
      <ul>
        <li><a href="/category/sneakers">Sneakers</a></li>
        <li><a href="/category/fashion">Fashion</a></li>
        <li><a href="/category/electronics">Electronics</a></li>
        <li><a href="/category/all">All products</a></li>
      </ul>
      <p><small>As an affiliate, ClickShop may earn a commission from partner links. Ad placements are clearly marked and reserved in fixed-size boxes.</small></p>
    </div>
    <!--/PRERENDER:NOSCRIPT-->
  </noscript>

  <!--
    Custom bootstrap (web/flutter_bootstrap.js) pins the renderer to "skwasm"
    and skips engine startup entirely for known crawlers, so bots that bypass
    the edge proxy still receive instant static content.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
